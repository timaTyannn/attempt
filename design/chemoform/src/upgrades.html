/* Layout: 1920×1080 «Улучшения» screen modelled on the research tree from The Alters: tabs, branch sub-tabs, tree with level gates, queue + detail card on the right. Accent teal replaces Alters' magenta. Single dark look by design. */
:root {
  color-scheme: dark;
  --page: #0a0a0a;
  --bg: #161717;
  --text: #ececec;
  --muted: #a0a0a0;
  --dim: #5a5a5a;
  --line: #4a4a4a;
  --accent: #3dd4c4;
  --dark: #0b201e;
  --mono: "Disket Mono", ui-monospace, Menlo, monospace;
  --body: "Jost", "Segoe UI", system-ui, sans-serif;
}
html, body { background: var(--page); color: var(--text); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: grid; gap: 12px; }
.wrap > p { margin: 0; color: var(--muted); max-width: 84ch; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg); outline: none; }
.stage:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: radial-gradient(ellipse 1300px 900px at 700px 500px, #222424, #141515 80%); font-family: var(--body); color: var(--text); }
.kc { display: inline-grid; place-items: center; min-width: 32px; height: 30px; padding: 0 7px; border-radius: 5px; background: #d8d8d8; color: #141414; font-family: var(--mono); font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 #8a8a8a; }

/* tabs */
.tabs { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; justify-content: center; align-items: center; }
.tabs .kc { margin: 0 28px; }
.tab { position: relative; height: 64px; padding: 0 30px; display: flex; gap: 10px; align-items: center; font-family: var(--mono); font-weight: 700; font-size: 21px; letter-spacing: .05em; }
.tab.home { font-size: 27px; }
.tab.on { background: var(--accent); color: var(--dark); }
.tab.on::after { content: ""; position: absolute; bottom: -15px; left: 50%; width: 9px; height: 9px; border-right: 2px solid #999; border-bottom: 2px solid #999; transform: translateX(-50%) rotate(45deg); }
.bang { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--dark); font-size: 12px; }
.tab.on .bang { background: var(--dark); color: var(--accent); }
.pts { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--accent); color: var(--dark); font-size: 15px; }
.tab.on .pts { background: var(--dark); color: var(--accent); }

/* branches */
.branches { position: absolute; left: 320px; top: 84px; display: flex; align-items: flex-start; gap: 6px; }
.branches .kc { margin-top: 18px; }
.br { width: 160px; height: 64px; display: grid; justify-items: center; align-content: center; gap: 8px; font-family: var(--mono); font-weight: 700; font-size: 17px; letter-spacing: .06em; color: var(--text); cursor: pointer; }
.br.on { height: 92px; background: #0c0c0c; }
.br svg { width: 26px; height: 26px; display: none; } .br.on svg { display: block; }
.br svg * { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.br .bang { margin-left: 8px; vertical-align: 2px; }

.lvl { position: absolute; left: 70px; top: 128px; display: flex; gap: 14px; align-items: center; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; line-height: 1.25; color: var(--muted); }
.roman { width: 38px; height: 38px; border-radius: 50%; background: var(--text); color: #111; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 17px; }
.points { position: absolute; left: 1130px; top: 124px; display: flex; gap: 16px; align-items: center; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; line-height: 1.25; color: var(--muted); }
.points b { font-family: var(--mono); font-size: 40px; color: var(--accent); font-weight: 700; letter-spacing: 0; }
.points .chip { width: 38px; height: 38px; background: var(--text); border-radius: 4px; display: grid; place-items: center; }
.points .chip svg { width: 26px; height: 26px; } .points .chip svg * { fill: none; stroke: #111; stroke-width: 2.5; stroke-linecap: round; }

.gatelabel { position: absolute; left: 1100px; top: 960px; display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 17px; letter-spacing: .1em; color: var(--muted); }
.gatelabel i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; }
svg.wires { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
.node { position: absolute; width: 230px; margin-left: -115px; display: grid; justify-items: center; gap: 12px; cursor: pointer; text-align: center; }
.node .sq { width: 76px; height: 76px; border-radius: 7px; display: grid; place-items: center; position: relative; }
.node .sq svg { width: 50px; height: 50px; }
.node .sq svg * { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.node .nm { font-family: var(--mono); font-size: 17px; letter-spacing: .03em; line-height: 1.2; }
.node.done .sq { background: #ececec; } .node.done .sq svg * { stroke: #151515; } .node.done .nm { color: var(--text); }
.node.avail .sq { background: #0b0b0b; box-shadow: inset 0 0 0 1.5px #5c5c5c; } .node.avail .sq svg * { stroke: var(--text); } .node.avail .nm { color: var(--text); }
.node.prog .sq { background: #0b0b0b; } .node.prog .sq svg { display: none; } .node.prog .sq b { font-family: var(--mono); font-size: 22px; color: var(--accent); }
.node.prog .nm { color: var(--text); }
.node.lock .sq { background: #1f2020; } .node.lock .sq svg * { stroke: #5a5a5a; } .node.lock .nm { color: #6c6c6c; }
.node.sel .sq { background: var(--accent); box-shadow: none; } .node.sel .sq svg * { stroke: var(--dark); } .node.sel .nm { color: var(--accent); }
.node.sel .sq::before { content: ""; position: absolute; left: -26px; top: 6px; width: 16px; height: 16px; border: 2px solid var(--accent); }
.node .cost { position: absolute; left: -24px; top: -6px; width: 26px; height: 26px; background: var(--text); border-radius: 4px; display: none; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; color: #111; }
.node.avail .cost, .node.sel .cost { display: grid; }
.node.sel .cost { left: -30px; top: 30px; }
.gate { position: absolute; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; border: 2.5px solid #6a6a6a; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 22px; color: #9a9a9a; background: #181919; }

/* right */
.qtitle { position: absolute; right: 70px; top: 124px; font-family: var(--mono); font-weight: 700; font-size: 38px; letter-spacing: .02em; padding-bottom: 8px; background: repeating-linear-gradient(90deg, var(--text) 0 14px, transparent 14px 20px) left bottom / 100% 3px no-repeat; }
.queue { position: absolute; left: 1440px; right: 70px; top: 196px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { height: 128px; background: #0b0b0b; padding: 12px 14px; position: relative; display: grid; grid-template-rows: auto 1fr; }
.slot.empty { background: rgba(255,255,255,.04); }
.slot .t { font-family: var(--mono); font-size: 15px; letter-spacing: .04em; }
.slot svg { width: 52px; height: 52px; align-self: end; } .slot svg * { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.slot .r { position: absolute; right: 14px; bottom: 18px; text-align: right; font-family: var(--mono); font-size: 15px; color: var(--muted); }
.slot .r b { display: block; font-size: 24px; color: var(--accent); font-weight: 400; }
.slot .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #2a2a2a; } .slot .bar i { display: block; height: 100%; background: var(--accent); }
.detail { position: absolute; left: 1440px; right: 70px; top: 370px; height: 610px; overflow: hidden; background: #0b0b0b; border-radius: 10px; padding: 28px 34px; display: flex; flex-direction: column; }
.detail::before, .detail::after { content: ""; position: absolute; width: 18px; height: 18px; border: 1.5px solid #3a3a3a; }
.detail::before { left: 14px; top: 14px; border-right: 0; border-bottom: 0; } .detail::after { right: 14px; top: 14px; border-left: 0; border-bottom: 0; }
.detail .art { height: 210px; display: grid; place-items: center; position: relative; }
.detail .art svg { width: 200px; height: 200px; } .detail .art svg * { fill: none; stroke: #dcdcdc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.detail .fx { position: absolute; right: 0; top: 10px; display: grid; gap: 6px; text-align: right; font-family: var(--mono); font-weight: 700; font-size: 26px; }
.detail .fx span { color: var(--text); } .detail .fx small { display: block; font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--muted); }
.detail h3 { margin: 14px 0 8px; font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: .03em; }
.detail p { margin: 0; font-size: 19px; line-height: 1.4; color: #cfcfcf; }
.detail .need { margin-top: 10px; font-size: 18px; color: var(--muted); }
.detail .need b { color: var(--text); font-weight: 500; }
.detail .meta { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; align-items: end; }
.detail .meta .go { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid #2a2a2a; }
.detail .meta .lb { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; color: var(--muted); }
.detail .meta .v { font-family: var(--mono); font-size: 24px; margin-top: 6px; display: flex; gap: 10px; align-items: center; }
.detail .go { font-family: var(--mono); font-weight: 700; font-size: 20px; color: var(--accent); display: flex; gap: 10px; align-items: center; }
.detail .go.off { color: var(--dim); } .detail .go.off .kc { background: #555; box-shadow: 0 4px 0 #333; }

/* footer */
.back { position: absolute; left: 1440px; top: 1012px; display: none; }
.mons { position: absolute; left: 0; right: 0; top: 1012px; display: flex; justify-content: center; gap: 40px; font-family: var(--mono); font-size: 17px; color: var(--muted); }
.mons span { display: flex; gap: 10px; align-items: center; }
.mons .on { color: var(--text); } .mons .on .kc { background: var(--accent); box-shadow: 0 4px 0 #1f7d73; }
.esc { position: absolute; left: 70px; top: 1008px; display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 20px; border: 1.5px solid #666; padding: 7px 12px; }
</style>

      { id: "b1", n: "ВТОРОЙ ПРИЁМНИК", x: 560, t: 1, st: "avail", sel: true, ic: "tray", d: "На столе можно держать два образца и сравнивать их.", fx: ["+1", "приёмник"], cost: 3, time: "2 образца" },
      { id: "b2", n: "ЦЕНТРИФУГА", x: 1050, t: 1, st: "avail", ic: "etalon", d: "Отделяет осадок от раствора.", fx: ["+1", "прибор"], cost: 1, time: "1 образец" },
      { id: "b3", n: "ЧЕТВЁРТЫЙ МОНИТОР", x: 805, t: 3, st: "lock", gate: "III", par: ["b1", "b2"], ic: "mon", d: "Ещё один монитор на столе.", fx: ["+1", "монитор"], cost: 5, time: "3 образца", need: "уровень лаборатории III" }
    ] },
    { name: "СЮЖЕТ", icon: "pt", rootX: 995, bang: true, nodes: [
      { id: "c1", n: "ПРОТОКОЛ «ЧИСТАЯ ВОДА»", x: 995, t: 1, st: "avail", sel: true, ic: "ph", d: "Открывает сюжетную цепочку станции водоочистки.", fx: ["гл. 1", "сюжет"], cost: 0, time: "сразу" }
    ] }
  ];
  const TABS = [["⌂", "home"], ["АНАЛИЗ"], ["ПРИБОРЫ"], ["БАЗА ДАННЫХ"], ["ЖУРНАЛ", "j"], ["УЛУЧШЕНИЯ", "u"]];
  const TY = { 1: 300, 2: 520, 3: 740 };
  let b = 0, points = 3;
  const $ = id => document.getElementById(id);

  function render() {
    const br = BRANCHES[b], nodes = br.nodes, sel = nodes.find(n => n.sel) || nodes[0];
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    // wires
    let w = "";
    const lit = n => n.st === "done";
    const wire = (x1, y1, x2, y2, on) => { const my = y1 + (y2 - y1) / 2; w += `<path d="M${x1} ${y1}V${my}H${x2}V${y2}" fill="none" stroke="${on ? "#dcdcdc" : "#4a4a4a"}" stroke-width="2.5"/>`; };
    const rootY = 176;
    nodes.filter(n => n.t === 1).forEach(n => wire(br.rootX, rootY, n.x, TY[1] - 38, true));
    nodes.forEach(n => (n.par || []).forEach(pid => { const p = byId[pid]; wire(p.x, TY[p.t] + 90, n.x, TY[n.t] - 38, lit(p)); }));
    nodes.filter(n => n.gate).forEach(n => { w += `<path d="M${n.x} ${TY[n.t] + 90}V${900}" fill="none" stroke="#4a4a4a" stroke-width="2.5"/>`; });

    const nodeHTML = nodes.map(n => `<div class="node ${n.st} ${n === sel ? "sel" : ""}" data-id="${n.id}" style="left:${n.x}px;top:${TY[n.t] - 38}px">
      <div class="sq">${n.st === "prog" ? `<b>${n.p}%</b>` : s(n.ic)}<span class="cost">${n.cost}</span></div><div class="nm">${n.n}</div></div>`).join("");
    const gates = nodes.filter(n => n.gate).map(n => `<div class="gate" style="left:${n.x}px;top:868px">${n.gate}</div>`).join("");

    const canBuy = sel.st === "avail" && points >= sel.cost;
    const stateLine = { done: "Исследовано.", prog: "Идёт исследование.", lock: `Нужно: <b>${sel.need || "предыдущее улучшение"}</b>.`, avail: points >= sel.cost ? "Доступно." : "Не хватает очков." }[sel.st];
    const big = BIG[sel.ic] ? `<svg viewBox="0 0 240 230" aria-hidden="true">${BIG[sel.ic]}</svg>` : `<svg viewBox="0 0 90 90" aria-hidden="true">${IC[sel.ic]}</svg>`;

    $("screen").innerHTML = `
      <div class="tabs"><span class="kc">Q</span>${TABS.map(([t, k]) => `<div class="tab ${k === "home" ? "home" : ""} ${k === "u" ? "on" : ""}">${t}${k === "j" ? '<span class="bang">!</span>' : ""}${k === "u" ? `<span class="pts">${points}</span>` : ""}</div>`).join("")}<span class="kc">E</span></div>
      <div class="branches"><span class="kc">A</span>${BRANCHES.map((x, i) => `<div class="br ${i === b ? "on" : ""}" data-b="${i}"><span>${x.name}${x.bang ? '<span class="bang">!</span>' : ""}</span><svg viewBox="0 0 90 90">${IC[x.icon]}</svg></div>`).join("")}<span class="kc">D</span></div>
      <div class="lvl"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="5" y="5" width="24" height="24" fill="none" stroke="#a0a0a0" stroke-width="2"/><rect x="11" y="11" width="12" height="12" fill="#a0a0a0"/></svg><span>УРОВЕНЬ<br>ЛАБОРАТОРИИ:</span><span class="roman">II</span></div>
      <div class="points"><span class="chip">${s("pt")}</span><span>ОЧКИ<br>ИССЛЕДОВАНИЙ:</span><b>${points}</b></div>
      <div class="gateband"></div>
      <svg class="wires" viewBox="0 0 1920 1080">${w}<path d="M${br.rootX} 176V176" /></svg>
      ${nodeHTML}${gates}
      <div class="gatelabel">УРОВЕНЬ <i>III</i> · ещё 2 образца</div>
      <div class="qtitle">ОЧЕРЕДЬ</div>
      <div class="queue">
        <div class="slot"><span class="t">УФ-СПЕКТРОМЕТР</span><svg viewBox="0 0 90 90">${IC.uv}</svg><span class="r">1 из 2 обр.<b>50%</b></span><span class="bar"><i style="width:50%"></i></span></div>
        <div class="slot empty"></div>
      </div>
      <div class="detail">
        <div class="art">${big}<div class="fx"><span>${sel.fx[0]}<small>${sel.fx[1]}</small></span></div></div>
        <h3>${sel.n}</h3><p>${sel.d}</p><div class="need">${stateLine}</div>
        <div class="meta"><div><div class="lb">ЦЕНА</div><div class="v"><span class="kc" style="min-width:26px;height:26px;font-size:13px">${s("pt").replace("<svg", '<svg width="16" height="16"')}</span>${sel.cost}</div></div>
          <div><div class="lb">ВРЕМЯ</div><div class="v">${sel.time}</div></div>
          <div class="go ${canBuy ? "" : "off"}" data-buy="1"><span class="kc">↵</span>ИССЛЕДОВАТЬ</div></div>
      </div>
      <div class="mons">${["ЛЕВЫЙ", "ЦЕНТР", "ПРАВЫЙ", "МОЛЕКУЛА"].map((n, i) => `<span class="${i === 1 ? "on" : ""}"><span class="kc">${i + 1}</span>${n}</span>`).join("")}</div>
      <div class="esc"><span class="kc">ESC</span>НАЗАД</div>`;
  }

  function select(id) { BRANCHES[b].nodes.forEach(n => n.sel = n.id === id); render(); }
  function buy() {
    const n = BRANCHES[b].nodes.find(x => x.sel);
    if (!n || n.st !== "avail" || points < n.cost) return;
    points -= n.cost; n.st = "prog"; n.p = 0; render();
  }
  const screen = $("screen"), stage = $("stage");
  screen.addEventListener("click", e => {
    stage.focus({ preventScroll: true });
    const n = e.target.closest(".node"); if (n) return select(n.dataset.id);
    const br = e.target.closest(".br"); if (br) { b = +br.dataset.b; return render(); }
    if (e.target.closest("[data-buy]")) buy();
  });
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "a" || k === "ф") { b = (b + BRANCHES.length - 1) % BRANCHES.length; render(); }
    else if (k === "d" || k === "в") { b = (b + 1) % BRANCHES.length; render(); }
    else if (e.key === "Enter") { e.preventDefault(); buy(); }
  });

  const fit = () => { screen.style.transform = `scale(${stage.clientWidth / 1920})`; };
  new ResizeObserver(fit).observe(stage);
  fit();
  render();
})();
</script>
